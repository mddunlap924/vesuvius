<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 640" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">nnU-Net v2 Lifecycle</title>
        <desc id="archify-diagram-description">A lifecycle diagram generated by Archify.</desc>
