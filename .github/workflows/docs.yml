name: Deploy documentation

# Publishes the documentation portal in docs/repo-overview/ to GitHub Pages.
# The portal is hand-written static HTML with no build step, so the workflow only
# has to hand the directory to Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/repo-overview/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages defaults to disabled, so on a fresh repository, a fork, or a
          # repository recreated from scratch the action fails with
          # "Get Pages site failed" before it ever reaches the deploy step.
          # This lets the workflow configure Pages itself.
          enablement: true

      - name: Upload portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/repo-overview

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
